<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Cash Stuffing</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap">
    <style>
        :root {
            --bg: #FDFBFB; --rosa: #FFD1DC; --lavanda: #E6E6FA;
            --menta: #C8E6C9; --azzurro: #B3E5FC; --text: #5D5D5D;
        }
        body { font-family: 'Quicksand', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; padding-bottom: 100px; }
        
        .header-nav { display: flex; align-items: center; margin-bottom: 20px; justify-content: space-between; }
        .back-btn { background: var(--lavanda); border: none; font-size: 1.2rem; padding: 10px 15px; border-radius: 15px; cursor: pointer; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .card { 
            background: white; border-radius: 28px; padding: 25px 15px; 
            box-shadow: 0 8px 15px rgba(0,0,0,0.04); text-align: center;
            transition: 0.2s; border: none; position: relative;
        }
        .card:active { transform: scale(0.95); }
        .card-conto { background: var(--azzurro); }
        .card-macro { background: var(--lavanda); }
        .card-cat { background: var(--rosa); }

        .title { font-weight: 700; font-size: 1.1rem; display: block; }
        .balance { font-size: 1rem; margin-top: 8px; font-weight: bold; background: rgba(255,255,255,0.5); border-radius: 10px; padding: 2px 8px; }

        /* Modal per inserimento spesa */
        #modal-transazione {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
            align-items: center; justify-content: center; z-index: 200;
        }
        .modal-content { 
            background: white; width: 85%; padding: 25px; border-radius: 30px; 
            text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        input, select { width: 100%; padding: 15px; margin: 10px 0; border-radius: 15px; border: 1px solid #eee; font-family: inherit; box-sizing: border-box; }
        
        .btn-confirm { background: var(--menta); color: white; border: none; padding: 15px; width: 100%; border-radius: 15px; font-weight: 700; font-size: 1rem; }

        .fab { 
            position: fixed; bottom: 30px; right: 25px; width: 65px; height: 65px; 
            background: var(--menta); border-radius: 50%; border: none; 
            color: white; font-size: 35px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); 
        }

        #login-screen { position: fixed; inset: 0; background: var(--rosa); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 500; }
    </style>
</head>
<body>

<div id="login-screen">
    <h1 style="color: white; font-size: 2.5rem;">My Cash 🌸</h1>
    <input type="password" id="pw" placeholder="Password (12345)" style="width: 60%">
    <button onclick="login()" style="padding: 15px 40px; border-radius: 20px; border: none; font-weight: 700;">Entra</button>
</div>

<div id="app" style="display:none;">
    <div class="header-nav">
        <button id="back-btn" class="back-btn" onclick="goBack()" style="visibility: hidden;">← Torna</button>
        <span id="total-view" style="font-weight: bold; font-size: 1.2rem;"></span>
    </div>

    <h2 id="view-title" style="margin-bottom: 20px;">I tuoi Conti</h2>
    <div id="main-grid" class="grid"></div>
    
    <button class="fab" onclick="openModal()">+</button>
</div>

<div id="modal-transazione">
    <div class="modal-content">
        <h3 id="modal-title">Nuova Transazione</h3>
        <input type="number" id="tr-amount" placeholder="Importo (es: -20 o 50)">
        <input type="text" id="tr-desc" placeholder="Descrizione (es: Spesa)">
        
        <div id="select-area">
            <label>Seleziona Categoria:</label>
            <select id="tr-category"></select>
        </div>

        <button class="btn-confirm" onclick="saveTransaction()">Salva</button>
        <button onclick="closeModal()" style="background: none; border: none; margin-top: 15px; color: #aaa;">Annulla</button>
    </div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('myCashDB')) || {
        conti: [{id: 1, nome: "Conto Principale"}],
        macros: [{id: 1, nome: "Casa", contoId: 1}],
        categories: [{id: 1, nome: "Spesa", macroId: 1}],
        transactions: [] // Ogni transazione: {id, catId, desc, amount, date}
    };

    let currentView = 'conti';
    let selectedConto = null;
    let selectedMacro = null;

    function login() {
        if(document.getElementById('pw').value === '12345') {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            render();
        }
    }

    // Funzione per calcolare il saldo di una categoria
    function getCatBalance(catId) {
        return db.transactions
            .filter(t => t.catId === catId)
            .reduce((sum, t) => sum + t.amount, 0);
    }

    // Funzione per calcolare il saldo di una macro
    function getMacroBalance(macroId) {
        return db.categories
            .filter(c => c.macroId === macroId)
            .reduce((sum, c) => sum + getCatBalance(c.id), 0);
    }

    // Funzione per calcolare il saldo di un conto
    function getContoBalance(contoId) {
        return db.macros
            .filter(m => m.contoId === contoId)
            .reduce((sum, m) => sum + getMacroBalance(m.id), 0);
    }

    function render() {
        const grid = document.getElementById('main-grid');
        const title = document.getElementById('view-title');
        const backBtn = document.getElementById('back-btn');
        grid.innerHTML = '';

        if(currentView === 'conti') {
            title.innerText = "I tuoi Conti";
            backBtn.style.visibility = 'hidden';
            db.conti.forEach(c => {
                const bal = getContoBalance(c.id);
                grid.innerHTML += `<div class="card card-conto" onclick="openConto(${c.id})"><span class="title">${c.nome}</span><div class="balance">€ ${bal.toFixed(2)}</div></div>`;
            });
        } 
        else if(currentView === 'macros') {
            title.innerText = "Macrocategorie";
            backBtn.style.visibility = 'visible';
            db.macros.filter(m => m.contoId === selectedConto).forEach(m => {
                const bal = getMacroBalance(m.id);
                grid.innerHTML += `<div class="card card-macro" onclick="openMacro(${m.id})"><span class="title">${m.nome}</span><div class="balance">€ ${bal.toFixed(2)}</div></div>`;
            });
        }
        else if(currentView === 'categories') {
            title.innerText = "Categorie";
            backBtn.style.visibility = 'visible';
            db.categories.filter(cat => cat.macroId === selectedMacro).forEach(cat => {
                const bal = getCatBalance(cat.id);
                grid.innerHTML += `<div class="card card-cat"><span class="title">${cat.nome}</span><div class="balance">€ ${bal.toFixed(2)}</div></div>`;
            });
        }
        localStorage.setItem('myCashDB', JSON.stringify(db));
    }

    function openConto(id) { selectedConto = id; currentView = 'macros'; render(); }
    function openMacro(id) { selectedMacro = id; currentView = 'categories'; render(); }
    function goBack() {
        if(currentView === 'categories') currentView = 'macros';
        else if(currentView === 'macros') currentView = 'conti';
        render();
    }

    // GESTIONE MODAL E TRANSAZIONI
    function openModal() {
        const select = document.getElementById('tr-category');
        select.innerHTML = '';
        
        // Popola la lista delle categorie
        db.categories.forEach(cat => {
            const macro = db.macros.find(m => m.id === cat.macroId);
            const conto = db.conti.find(c => c.id === macro.contoId);
            select.innerHTML += `<option value="${cat.id}">${conto.nome} > ${cat.nome}</option>`;
        });

        document.getElementById('modal-transazione').style.display = 'flex';
    }

    function closeModal() { document.getElementById('modal-transazione').style.display = 'none'; }

    function saveTransaction() {
        const amount = parseFloat(document.getElementById('tr-amount').value);
        const desc = document.getElementById('tr-desc').value;
        const catId = parseInt(document.getElementById('tr-category').value);

        if(!amount || !catId) return alert("Inserisci almeno l'importo!");

        db.transactions.push({
            id: Date.now(),
            catId: catId,
            amount: amount,
            desc: desc,
            date: new Date().toISOString()
        });

        closeModal();
        render();
    }
</script>
</body>
</html>
